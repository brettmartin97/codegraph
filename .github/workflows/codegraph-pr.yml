name: CodeGraph Impact Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  codegraph:
    name: Blast-radius analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so git diff works

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Cache the codegraph DB between runs so incremental indexing is fast
      - name: Cache CodeGraph DB
        uses: actions/cache@v5
        with:
          path: ~/.codegraph
          key: codegraph-${{ github.repository }}-${{ github.ref_name }}-${{ hashFiles('**/*.py', '**/*.ts', '**/*.go', '**/*.js') }}
          restore-keys: |
            codegraph-${{ github.repository }}-${{ github.ref_name }}-
            codegraph-${{ github.repository }}-

      - name: Install CodeGraph MCP
        run: pip install "codegraph-mcp[full]" --quiet

      - name: Register & index repo (incremental)
        env:
          CODEGRAPH_REPO_ROOT: ${{ github.workspace }}
          CODEGRAPH_DB_PATH: ~/.codegraph/codegraph.db
          CODEGRAPH_ALLOW_EXTERNAL_REPOS: "true"
        run: |
          codegraph repo add ${{ github.event.repository.name }} ${{ github.workspace }} || true
          codegraph index ${{ github.event.repository.name }} --mode incremental

      - name: Generate impact comment
        id: impact
        env:
          CODEGRAPH_REPO_ROOT: ${{ github.workspace }}
          CODEGRAPH_DB_PATH: ~/.codegraph/codegraph.db
          CODEGRAPH_ALLOW_EXTERNAL_REPOS: "true"
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            | codegraph ci pr-comment ${{ github.event.repository.name }} \
            > /tmp/codegraph-comment.md
          echo "comment_file=/tmp/codegraph-comment.md" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/codegraph-comment.md', 'utf8');

            // Find and update existing bot comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CodeGraph Impact Analysis')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Optional: fail the check if high-risk functions were changed
      - name: Risk gate (optional — remove or adjust threshold)
        env:
          CODEGRAPH_REPO_ROOT: ${{ github.workspace }}
          CODEGRAPH_DB_PATH: ~/.codegraph/codegraph.db
          CODEGRAPH_ALLOW_EXTERNAL_REPOS: "true"
        run: |
          FUNCTIONS=$(
            git diff origin/${{ github.base_ref }}...HEAD \
              | codegraph ci changed-functions ${{ github.event.repository.name }} \
              | python3 -c "
          import json, sys
          fns = json.load(sys.stdin)
          non_test = [f['function'] for f in fns if not f.get('is_test')]
          print(' '.join(f'--function {fn}' for fn in non_test[:10]))
          "
          )
          if [ -n "$FUNCTIONS" ]; then
            codegraph ci risk-gate ${{ github.event.repository.name }} \
              $FUNCTIONS \
              --threshold 0.80
          fi
        continue-on-error: true   # change to false to make this a hard gate

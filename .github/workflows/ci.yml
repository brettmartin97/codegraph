name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Run tests
        run: pytest tests/ --ignore=tests/test_e2e_large_repo.py -v --tb=short

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: .coverage

  dogfood:
    name: Self-index (dogfood test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[full]"

      - name: Index this repo with CodeGraph
        env:
          CODEGRAPH_ALLOW_EXTERNAL_REPOS: "true"
          CODEGRAPH_DB_PATH: /tmp/dogfood.db
        run: |
          codegraph repo add codegraph-mcp ${{ github.workspace }}
          codegraph index codegraph-mcp --mode full --json

      - name: Doctor check
        env:
          CODEGRAPH_ALLOW_EXTERNAL_REPOS: "true"
          CODEGRAPH_DB_PATH: /tmp/dogfood.db
        run: codegraph doctor || true

      - name: Show overview
        env:
          CODEGRAPH_ALLOW_EXTERNAL_REPOS: "true"
          CODEGRAPH_DB_PATH: /tmp/dogfood.db
        run: codegraph overview codegraph-mcp --json

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, dogfood]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

[project]
name = "codegraph-mcp"
version = "0.3.0"
description = "Function-first code intelligence graph MCP — AST parsing for Python, JS/TS, Go, Java, Rust, C#, YAML, JSON, Docker"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "networkx>=3.2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
llm-anthropic = ["anthropic>=0.30"]
llm-openai    = ["openai>=1.0", "httpx>=0.27"]
llm-all       = ["anthropic>=0.30", "openai>=1.0", "httpx>=0.27"]
treesitter = [
  "tree-sitter>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-go>=0.21",
]
treesitter-jvm = [
  "tree-sitter>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-c-sharp>=0.21",
]
watch = ["watchfiles>=0.21"]
full = [
  "mcp>=1.2.0",
  "tree-sitter>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-go>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-c-sharp>=0.21",
  "watchfiles>=0.21",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "tree-sitter>=0.21",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-go>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-c-sharp>=0.21",
  "watchfiles>=0.21",
]

[project.scripts]
codegraph     = "codegraph_mcp.cli.app:app"
codegraph-mcp = "codegraph_mcp.server.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["src/codegraph_mcp"]
omit = ["*/tests/*"]
